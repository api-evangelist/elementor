notes: >-
  Elementor is a WordPress plugin, not a hosted REST API, so it ships no
  language API-client SDKs. Its first-party published packages are the plugin
  itself (WordPress.org) and a family of editor/UI JavaScript libraries under
  the @elementor npm scope (owned by Elementor). These are extension/UI
  libraries, not API clients.
