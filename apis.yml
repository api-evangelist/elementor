aid: elementor
name: Elementor
description: >-
  Elementor is a WordPress website builder that lets users design pixel-perfect
  websites through a visual drag-and-drop editor, without writing code. Beyond
  the core page builder it ships Elementor Pro, the Hello theme, a hosted
  Elementor Cloud/Website offering, and an AI-assisted "Elementor One" plan set.
  For developers, Elementor is an extensible platform rather than a hosted REST
  API: it exposes a PHP extension surface (widgets, controls, dynamic tags, form
  actions, hooks, and managers), a WP-CLI command set, an auto-generated PHP code
  reference at code.elementor.com, and a family of first-party npm packages under
  the @elementor scope (editor UI, icons, design tokens). This profile catalogs
  Elementor's public developer and product surface for the API Evangelist network.
